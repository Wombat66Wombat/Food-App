<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Pong</title>
  <meta name="theme-color" content="#0e1411">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #0e1411; --fg: #e8efe9; --muted: #93a198; --accent: #22c55e; --line: #2a352e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top)) 16px 16px; overscroll-behavior: none; }
    header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    a, button { color: var(--accent); font: inherit; font-weight: 600; }
    a { text-decoration: none; }
    button { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; cursor: pointer; }
    canvas { width: 100%; max-width: 800px; aspect-ratio: 4 / 3; max-height: calc(100vh - 240px); object-fit: contain; background: #000; border-radius: 12px; display: block; touch-action: none; }
    .hint { color: var(--muted); font-size: 0.85rem; text-align: center; }
    .levels { width: 100%; max-width: 800px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .levels[hidden] { display: none; }
    .lvl { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; border: 1px solid var(--line); background: #141c17; color: var(--fg); font-weight: 600; font-size: 0.8rem; }
    .lvl b { font-size: 1.1rem; }
    .lvl small { color: #facc15; letter-spacing: 1px; min-height: 1em; }
    .lvl .name { color: var(--muted); font-size: 0.68rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .lvl.current { border-color: var(--accent); background: #173524; }
    .lvl:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <header>
    <a href="./">← Back</a>
    <strong id="title">🏓 Pong</strong>
    <button id="mode">1 player</button>
  </header>
  <canvas id="game" width="800" height="600" aria-label="Pong game"></canvas>
  <div class="levels" id="levels" aria-label="Levels"></div>
  <div class="hint" id="hint">Beat the computer to unlock the next level · Left: W / S or ↑ / ↓ · Touch: drag · Space / tap to start · P to pause</div>

  <script type="module">
    const W = 800, H = 600, PAD_W = 12, BALL = 12;

    // Each level makes the computer and the ball faster, and some add a twist.
    const LEVELS = [
      { name: 'Warm-up', ai: 200, ball: 290, speedup: 1.04, pad: 110, aiPad: 90, win: 3 },
      { name: 'Rookie', ai: 250, ball: 320, speedup: 1.05, pad: 100, aiPad: 90, win: 5 },
      { name: 'Rally', ai: 290, ball: 350, speedup: 1.05, pad: 95, aiPad: 90, win: 5 },
      { name: 'Speed up', ai: 320, ball: 370, speedup: 1.08, pad: 90, aiPad: 90, win: 5 },
      { name: 'Moving wall', ai: 330, ball: 360, speedup: 1.05, pad: 90, aiPad: 90, win: 5, wall: true },
      { name: 'Smart CPU', ai: 340, ball: 380, speedup: 1.06, pad: 90, aiPad: 90, win: 5, smart: true },
      { name: 'Tiny paddles', ai: 360, ball: 380, speedup: 1.06, pad: 65, aiPad: 65, win: 5, smart: true },
      { name: 'Wall 2.0', ai: 380, ball: 400, speedup: 1.06, pad: 85, aiPad: 85, win: 5, wall: true, smart: true },
      { name: 'Lightning', ai: 420, ball: 450, speedup: 1.07, pad: 85, aiPad: 85, win: 5, smart: true },
      { name: 'Boss', ai: 480, ball: 460, speedup: 1.07, pad: 85, aiPad: 115, win: 7, smart: true, wall: true },
    ];
    const TWO_PLAYER = { name: '2 players', ai: 0, ball: 360, speedup: 1.06, pad: 90, aiPad: 90, win: 7 };

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const modeBtn = document.getElementById('mode');
    const levelsEl = document.getElementById('levels');
    const titleEl = document.getElementById('title');

    const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
    const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* ignore */ } };
    let unlocked = load('pong.unlocked', 1); // highest level you can play (1-based)
    let stars = load('pong.stars', {}); // { level: 1..3 }
    let levelIndex = Math.min(load('pong.level', 1), unlocked) - 1;

    const left = { y: 0, h: 90, score: 0, up: false, down: false };
    const right = { y: 0, h: 90, score: 0, up: false, down: false };
    const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
    const wall = { x: W / 2 - 7, y: 200, w: 14, h: 130, vy: 150 };
    let twoPlayer = false;
    let state = 'ready'; // ready | playing | paused | over
    let winner = '';
    let result = null; // { won, stars, next }
    let aiError = 0;

    const level = () => (twoPlayer ? TWO_PLAYER : LEVELS[levelIndex]);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    function serve(dir = Math.random() < 0.5 ? -1 : 1) {
      ball.x = W / 2 - BALL / 2;
      ball.y = H / 2 + (Math.random() * 200 - 100);
      const angle = Math.random() * 0.8 - 0.4;
      ball.vx = Math.cos(angle) * level().ball * dir;
      ball.vy = Math.sin(angle) * level().ball;
      aiError = 0;
    }

    function reset() {
      const lv = level();
      left.score = right.score = 0;
      left.h = lv.pad;
      right.h = twoPlayer ? lv.pad : lv.aiPad;
      left.y = H / 2 - left.h / 2;
      right.y = H / 2 - right.h / 2;
      wall.y = H / 2 - wall.h / 2;
      winner = '';
      result = null;
      serve();
      state = 'ready';
      titleEl.textContent = twoPlayer ? '🏓 Pong · 2 players' : `🏓 Level ${levelIndex + 1} · ${lv.name}`;
      renderLevels();
    }

    function start() {
      if (state === 'over') {
        if (result?.won && result.next) levelIndex = Math.min(levelIndex + 1, LEVELS.length - 1);
        save('pong.level', levelIndex + 1);
        reset();
      }
      if (state === 'ready' || state === 'paused') state = 'playing';
    }

    function movePaddle(p, dt) {
      const speed = 480;
      if (p.up) p.y -= speed * dt;
      if (p.down) p.y += speed * dt;
      p.y = clamp(p.y, 0, H - p.h);
    }

    // Where the ball will cross the computer's side, following wall bounces.
    function predictY() {
      const rx = W - 24 - PAD_W - BALL;
      if (ball.vx <= 0) return ball.y;
      let y = ball.y + ball.vy * ((rx - ball.x) / ball.vx);
      const span = H - BALL;
      y = ((y % (2 * span)) + 2 * span) % (2 * span);
      return y > span ? 2 * span - y : y;
    }

    function ai(dt) {
      const lv = level();
      let target;
      if (ball.vx > 0) {
        const aimY = lv.smart ? predictY() : ball.y;
        target = aimY + BALL / 2 - right.h / 2 + aiError;
      } else {
        target = H / 2 - right.h / 2;
      }
      const diff = target - right.y;
      const max = lv.ai * dt;
      right.y = clamp(right.y + clamp(diff, -max, max), 0, H - right.h);
    }

    function bounce(p, x) {
      // Angle depends on where the ball hits the paddle; speed up a little each hit.
      const rel = (ball.y + BALL / 2 - (p.y + p.h / 2)) / (p.h / 2);
      const angle = clamp(rel, -1, 1) * (Math.PI / 3.5);
      const speed = Math.min(Math.hypot(ball.vx, ball.vy) * level().speedup, 950);
      const dir = ball.vx > 0 ? -1 : 1;
      ball.vx = Math.cos(angle) * speed * dir;
      ball.vy = Math.sin(angle) * speed;
      ball.x = x;
      // The computer misjudges a bit so it can be beaten; less on higher levels.
      if (p === left) aiError = (Math.random() - 0.5) * right.h * (1.5 - levelIndex * 0.08);
      beep(520);
    }

    function point(p) {
      p.score++;
      beep(220);
      const lv = level();
      if (p.score >= lv.win) {
        state = 'over';
        if (twoPlayer) {
          winner = p === left ? 'Left player wins!' : 'Right player wins!';
          return;
        }
        const won = p === left;
        let earned = 0;
        if (won) {
          const conceded = right.score;
          earned = conceded <= 1 ? 3 : conceded <= 3 ? 2 : 1;
          stars[levelIndex + 1] = Math.max(stars[levelIndex + 1] || 0, earned);
          save('pong.stars', stars);
          if (levelIndex + 2 > unlocked && levelIndex + 1 < LEVELS.length) {
            unlocked = levelIndex + 2;
            save('pong.unlocked', unlocked);
          }
        }
        result = { won, stars: earned, next: won && levelIndex + 1 < LEVELS.length };
        winner = won
          ? (levelIndex + 1 === LEVELS.length ? '🏆 You beat the Boss!' : `Level ${levelIndex + 1} complete!`)
          : 'Computer wins — try again!';
        renderLevels();
        beep(won ? 880 : 160);
      } else {
        serve(p === left ? 1 : -1);
      }
    }

    function update(dt) {
      movePaddle(left, dt);
      if (twoPlayer) movePaddle(right, dt); else ai(dt);
      if (state !== 'playing') return;

      if (level().wall) {
        wall.y += wall.vy * dt;
        if (wall.y < 60 || wall.y + wall.h > H - 60) { wall.vy *= -1; wall.y = clamp(wall.y, 60, H - 60 - wall.h); }
      }

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      if (ball.y < 0) { ball.y = 0; ball.vy *= -1; beep(380); }
      if (ball.y > H - BALL) { ball.y = H - BALL; ball.vy *= -1; beep(380); }

      if (level().wall && ball.x + BALL > wall.x && ball.x < wall.x + wall.w && ball.y + BALL > wall.y && ball.y < wall.y + wall.h) {
        ball.x = ball.vx > 0 ? wall.x - BALL : wall.x + wall.w;
        ball.vx *= -1;
        beep(300);
      }

      const lx = 24 + PAD_W, rx = W - 24 - PAD_W;
      if (ball.vx < 0 && ball.x <= lx && ball.x >= lx - PAD_W - BALL && ball.y + BALL >= left.y && ball.y <= left.y + left.h) bounce(left, lx);
      if (ball.vx > 0 && ball.x + BALL >= rx && ball.x + BALL <= rx + PAD_W + BALL && ball.y + BALL >= right.y && ball.y <= right.y + right.h) bounce(right, rx - BALL);

      if (ball.x < -BALL) point(right);
      if (ball.x > W) point(left);
    }

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#2a352e';
      for (let y = 10; y < H; y += 30) ctx.fillRect(W / 2 - 2, y, 4, 16);

      ctx.fillStyle = '#e8efe9';
      ctx.font = 'bold 64px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(left.score, W / 4, 80);
      ctx.fillText(right.score, (3 * W) / 4, 80);
      ctx.font = '600 18px system-ui, sans-serif';
      ctx.fillStyle = '#93a198';
      ctx.fillText(twoPlayer ? `First to ${level().win}` : `Level ${levelIndex + 1} · ${level().name} · first to ${level().win}`, W / 2, H - 16);

      if (level().wall) {
        ctx.fillStyle = '#f97316';
        ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
      }

      ctx.fillStyle = '#22c55e';
      ctx.fillRect(24, left.y, PAD_W, left.h);
      ctx.fillStyle = twoPlayer ? '#22c55e' : levelIndex === LEVELS.length - 1 ? '#ef4444' : '#38bdf8';
      ctx.fillRect(W - 24 - PAD_W, right.y, PAD_W, right.h);
      ctx.fillStyle = '#e8efe9';
      ctx.fillRect(ball.x, ball.y, BALL, BALL);

      let msg = { ready: 'Press Space or tap to start', paused: 'Paused' }[state];
      let sub = '';
      if (state === 'over') {
        msg = winner;
        if (result?.won) sub = `${'★'.repeat(result.stars)}${'☆'.repeat(3 - result.stars)}   ·   ${result.next ? 'Space / tap for the next level' : 'Space / tap to play again'}`;
        else sub = 'Space / tap to play again';
      }
      if (msg) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, H / 2 - 55, W, sub ? 110 : 80);
        ctx.fillStyle = '#e8efe9';
        ctx.font = 'bold 30px system-ui, sans-serif';
        ctx.fillText(msg, W / 2, H / 2 + (sub ? -5 : 10));
        if (sub) {
          ctx.font = '600 20px system-ui, sans-serif';
          ctx.fillStyle = '#facc15';
          ctx.fillText(sub, W / 2, H / 2 + 32);
        }
      }
    }

    function renderLevels() {
      levelsEl.hidden = twoPlayer;
      levelsEl.innerHTML = LEVELS.map((lv, i) => {
        const n = i + 1;
        const s = stars[n] || 0;
        return `<button class="lvl ${i === levelIndex ? 'current' : ''}" data-level="${i}" ${n > unlocked ? 'disabled' : ''} title="${lv.name}">
          <b>${n > unlocked ? '🔒' : n}</b><span class="name">${lv.name}</span><small>${s ? '★'.repeat(s) : ''}</small></button>`;
      }).join('');
    }

    levelsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-level]');
      if (!btn || btn.disabled) return;
      levelIndex = Number(btn.dataset.level);
      save('pong.level', levelIndex + 1);
      btn.blur();
      reset();
    });

    let last = performance.now();
    function loop(now) {
      const dt = Math.min((now - last) / 1000, 1 / 30);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // Sound
    let audio = null;
    function beep(freq) {
      try {
        if (!audio) return;
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = 'square';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.05, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.08);
        o.connect(g).connect(audio.destination);
        o.start(); o.stop(audio.currentTime + 0.09);
      } catch { /* no sound */ }
    }
    function unlockAudio() {
      try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch { /* ignore */ }
    }

    // Keyboard
    const keys = { w: [left, 'up'], s: [left, 'down'], ArrowUp: [right, 'up'], ArrowDown: [right, 'down'] };
    function key(e, down) {
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      let bind = keys[k];
      // In 1-player mode the arrow keys also move your (left) paddle.
      if (!twoPlayer && (k === 'ArrowUp' || k === 'ArrowDown')) bind = [left, k === 'ArrowUp' ? 'up' : 'down'];
      if (bind) { bind[0][bind[1]] = down; e.preventDefault(); }
      if (!down) return;
      if (e.key === ' ') { unlockAudio(); start(); e.preventDefault(); }
      if (k === 'p' && (state === 'playing' || state === 'paused')) state = state === 'playing' ? 'paused' : 'playing';
    }
    addEventListener('keydown', (e) => key(e, true));
    addEventListener('keyup', (e) => key(e, false));
    addEventListener('blur', () => { if (state === 'playing') state = 'paused'; });

    // Touch / mouse: drag on your half of the table to move that paddle.
    function pointer(e) {
      const r = canvas.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width) * W;
      const y = ((e.clientY - r.top) / r.height) * H;
      const p = twoPlayer && x > W / 2 ? right : left;
      p.y = clamp(y - p.h / 2, 0, H - p.h);
    }
    canvas.addEventListener('pointerdown', (e) => {
      unlockAudio();
      if (state !== 'playing') start();
      canvas.setPointerCapture?.(e.pointerId);
      pointer(e);
    });
    canvas.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'touch') pointer(e); });

    modeBtn.addEventListener('click', () => {
      twoPlayer = !twoPlayer;
      modeBtn.textContent = twoPlayer ? '2 players' : '1 player';
      modeBtn.blur();
      reset();
    });

    // For testing: pong.debug.win() finishes the current level.
    window.pong = { debug: { win: () => { left.score = level().win - 1; point(left); }, lose: () => { right.score = level().win - 1; point(right); } } };

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
