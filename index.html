<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Food Planner</title>
  <meta name="description" content="Meal planner and calorie tracker with smart meal ideas and Apple Watch calories.">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Food Planner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">Today</h1>
    <div id="topbar-extra"></div>
  </header>

  <main id="app">
    <section id="view-today" class="view" aria-label="Today"></section>
    <section id="view-plan" class="view" aria-label="Meal plan" hidden></section>
    <section id="view-ideas" class="view" aria-label="Meal ideas" hidden></section>
    <section id="view-me" class="view" aria-label="Preferences" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button class="tab active" data-view="today"><span class="tab-icon" aria-hidden="true">🍽️</span>Today</button>
    <button class="tab" data-view="plan"><span class="tab-icon" aria-hidden="true">📅</span>Plan</button>
    <button class="tab" data-view="ideas"><span class="tab-icon" aria-hidden="true">💡</span>Ideas</button>
    <button class="tab" data-view="me"><span class="tab-icon" aria-hidden="true">⚙️</span>Me</button>
  </nav>

  <dialog id="sheet" class="sheet">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" id="sheet-close" aria-label="Close">✕</button>
    </div>
    <div id="sheet-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
