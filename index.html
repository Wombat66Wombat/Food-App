<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Space</title>
  <meta name="description" content="Your organized space: calorie deficit tracker, meal plan, timetable, Mandarin flashcards and a focus timer.">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Space">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">Food</h1>
    <div class="row">
      <div id="topbar-extra"></div>
      <button class="icon-btn gear" id="settings-btn" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <main id="app">
    <section id="view-food" class="view" aria-label="Food"></section>
    <section id="view-meals" class="view" aria-label="Meals" hidden></section>
    <section id="view-timetable" class="view" aria-label="Timetable" hidden></section>
    <section id="view-mandarin" class="view" aria-label="Mandarin" hidden></section>
    <section id="view-focus" class="view" aria-label="Focus" hidden></section>
    <section id="view-settings" class="view" aria-label="Settings" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button class="tab active" data-view="food"><span class="tab-icon" aria-hidden="true">🍽️</span>Food</button>
    <button class="tab" data-view="meals"><span class="tab-icon" aria-hidden="true">🥗</span>Meals</button>
    <button class="tab" data-view="timetable"><span class="tab-icon" aria-hidden="true">🗓️</span>Timetable</button>
    <button class="tab" data-view="mandarin"><span class="tab-icon" aria-hidden="true">🀄</span>中文</button>
    <button class="tab" data-view="focus"><span class="tab-icon" aria-hidden="true">⏱️</span>Fokus</button>
  </nav>

  <dialog id="sheet" class="sheet">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" id="sheet-close" aria-label="Close">✕</button>
    </div>
    <div id="sheet-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
